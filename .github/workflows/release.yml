name: Build and release
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version, for example 0.9.0 or 1.0.0-rc.1'
        type: string
        required: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve build version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$TAG" ]]; then
            version=$(node scripts/build-version.mjs "$TAG")
            [[ "$TAG" == "v$version" ]]
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            version=$(node scripts/build-version.mjs "$REQUESTED_VERSION")
          else
            version=$(node scripts/build-version.mjs)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          go-version: '1.27.4'
      - name: Vet
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: go vet ./...
      - name: Test
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: go test -race ./...
      - name: Vulnerability check
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          CGO_ENABLED=0 go build -trimpath -o /tmp/maker ./cmd/maker
          govulncheck -mode=binary /tmp/maker

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, goos: darwin, goarch: arm64, cgo: '1', ext: ''}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, cgo: '1', ext: ''}
          - {runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: '0', ext: ''}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cgo: '0', ext: ''}
          - {runner: windows-latest, goos: windows, goarch: amd64, cgo: '0', ext: '.exe'}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BINARY: maker_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Build and check version
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/SENTINELITE/elgato-makers-cli/internal/cli.Version=$VERSION" \
            -o "dist/$BINARY" ./cmd/maker
          [[ "$( "./dist/$BINARY" --version | tr -d '\r' )" == "maker version $VERSION" ]]
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ env.BINARY }}
          path: dist/${{ env.BINARY }}
          if-no-files-found: error

  package:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Package npm tarball and checksums
        run: |
          node scripts/package-npm.mjs "$VERSION" dist npm-package
          npm pack ./npm-package --ignore-scripts --pack-destination dist
          cd dist
          sha256sum maker_* sentinelite-elgato-makers-cli-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: maker-dist-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  npm-smoke:
    needs: [metadata, package]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: maker-dist-${{ env.VERSION }}
          path: dist
      - name: Install and run the packed CLI
        shell: bash
        run: |
          npm install --prefix npm-smoke --ignore-scripts --offline --no-audit --no-fund \
            "./dist/sentinelite-elgato-makers-cli-$VERSION.tgz"
          cli=./npm-smoke/node_modules/.bin/maker
          [[ "$( "$cli" --version | tr -d '\r' )" == "maker version $VERSION" ]]
          "$cli" --help > /dev/null
          if "$cli" unknown-command-for-smoke > /dev/null 2>&1; then
            echo "Expected the CLI to return a nonzero exit code." >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, npm-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: maker-dist-${{ needs.metadata.outputs.version }}
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/maker_*
            dist/*.tgz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in 0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --verify-tag "${prerelease[@]}"
